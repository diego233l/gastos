# Gastos · suscripciones  —  sitio nginx independiente (no toca ningún otro sitio).
#
# Instalación:   ln -s /opt/apps/gastos/nginx/gastos.conf /etc/nginx/sites-enabled/gastos.conf
# Si el puerto 8080 ya está en uso por otra web, cambia el número de `listen` (y el de ufw).
# Este archivo vive en el repositorio: `git pull` + `systemctl reload nginx` si cambia.

# Límite de peticiones a la API (nombre propio: no choca con otros sitios)
limit_req_zone $binary_remote_addr zone=gastos_api:1m rate=20r/s;

server {
    # Sin `[::]:8080`: falla en máquinas sin IPv6. Sin `default_server`: no pisa a la otra web.
    listen 8080;
    server_name _;

    root /opt/apps/gastos/web;
    index index.html;
    server_tokens off;

    # Contraseña (htpasswd creado con `openssl passwd -apr1`)
    auth_basic "Gastos";
    auth_basic_user_file /etc/nginx/gastos.htpasswd;

    # Límite de cuerpo: la foto reducida pesa < 700 KB, el JSON mucho menos
    client_max_body_size 1m;

    # Página y recursos estáticos
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Nunca servir ficheros ocultos
    location ~ /\. { deny all; }

    # API: un único script Python por CGI (fcgiwrap). Se lee del repositorio en cada petición.
    location /api/ {
        limit_req zone=gastos_api burst=60 nodelay;

        include fastcgi_params;
        fastcgi_pass unix:/run/fcgiwrap.socket;
        fastcgi_param SCRIPT_FILENAME /opt/apps/gastos/app/api.py;
        fastcgi_param PATH_INFO       $uri;
        fastcgi_param GASTOS_DATA_DIR /var/lib/gastos;
        fastcgi_read_timeout 30s;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_intercept_errors on;   # solo actúa sobre los códigos de error_page (502/504)

        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # Si el código se rompe tras un `git pull` (SyntaxError, script no ejecutable…),
        # fcgiwrap no devuelve nada y nginx daría un 502 mudo: respondemos JSON claro.
        error_page 502 504 = @gastos_api_down;
    }

    location @gastos_api_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 503 '{"error":"La API no responde. Si acabas de actualizar con git pull, el código puede estar roto: revisa `git -C /opt/apps/gastos log -3`, comprueba `python3 -m py_compile /opt/apps/gastos/app/api.py` y que `systemctl status fcgiwrap.socket` esté activo."}';
    }
}
